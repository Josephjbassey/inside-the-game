{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ match.home_team }} vs {{ match.away_team }} — Live Match Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Geist', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <!-- Studio / Broadcast Header -->
    <header class="bg-red-900 border-b border-red-700 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-white">INSIDE THE GAME</h1>
                <p class="text-red-200 text-sm">Premier League Match Intelligence — Live Dashboard</p>
            </div>
            <div class="text-right">
                <div class="text-lg font-mono text-red-100" id="match-clock">{{ match.match_clock }}s</div>
                <div class="text-xs text-red-300 uppercase tracking-wider">{{ match.get_status_display }}</div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 space-y-6">

        <!-- Scoreboard -->
        <div id="scoreboard" hx-get="{% url 'matches:scoreboard_partial' match.id %}" hx-trigger="every 2s" hx-swap="innerHTML">
            <!-- loaded via HTMX -->
        </div>

        <!-- Ticker + xG side by side -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

            <!-- Event Ticker -->
            <div class="bg-gray-800 border border-gray-700 rounded-lg p-4">
                <h2 class="text-xl font-bold text-white mb-4">Live Events</h2>
                <div id="ticker" hx-get="{% url 'matches:ticker_partial' match.id %}" hx-trigger="every 3s" hx-swap="innerHTML">
                    <!-- loaded via HTMX -->
                </div>
            </div>

            <!-- xG Chart Placeholder -->
            <div class="bg-gray-800 border border-gray-700 rounded-lg p-4">
                <h2 class="text-xl font-bold text-white mb-4">Expected Goals (xG)</h2>
                <div id="xg-chart" hx-get="{% url 'matches:xg_partial' match.id %}" hx-trigger="every 3s" hx-swap="innerHTML">
                    <!-- loaded via HTMX -->
                </div>
            </div>

        </div>

    </main>

    <script>
        // xG chart rendering (placeholder — render from HTMX JSON response)
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if (evt.target.id === 'xg-chart') {
                // Could render a canvas/SVG chart here from the JSON data
            }
        });
    </script>

</body>
</html>
