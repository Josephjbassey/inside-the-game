{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StudioLens{% endblock %} — Premier League Match Intelligence</title>
    <meta name="description" content="{% block meta_description %}AI-powered Premier League match intelligence dashboard with live narratives, tactical explainers, and multi-language fan experiences.{% endblock %}">
    <link rel="icon" type="image/svg+xml" href="{% static 'matches/favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'matches/css/studiolens.css' %}">
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <nav class="nav" id="main-nav">
        <div class="nav__inner">
            <a href="/" class="nav__brand" id="brand-link">
                <svg class="nav__brand-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="16" cy="16" r="14" fill="#DC143C" opacity="0.92"/>
                    <circle cx="16" cy="16" r="8" stroke="#fff" stroke-width="2" opacity="0.9"/>
                    <circle cx="16" cy="16" r="3" fill="#fff" opacity="0.95"/>
                </svg>
                <span class="nav__brand-text">Studio<span class="nav__brand-accent">Lens</span></span>
            </a>
            <div class="nav__links">
                <a href="/" class="nav__link {% block nav_active_dashboard %}{% endblock %}" id="nav-dashboard">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="1.5" y="1.5" width="5" height="5" rx="1"/>
                        <rect x="9.5" y="1.5" width="5" height="5" rx="1"/>
                        <rect x="1.5" y="9.5" width="5" height="5" rx="1"/>
                        <rect x="9.5" y="9.5" width="5" height="5" rx="1"/>
                    </svg>
                    <span>Dashboard</span>
                </a>
                {% if match %}
                <a href="{% url 'matches:studio_view' match.id %}" class="nav__link {% block nav_active_studio %}{% endblock %}" id="nav-studio">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="1.5" y="3" width="13" height="9" rx="1.5"/>
                        <line x1="6" y1="14" x2="10" y2="14"/>
                        <line x1="8" y1="12" x2="8" y2="14"/>
                    </svg>
                    <span>Studio</span>
                </a>
                <a href="{% url 'matches:fan_view' match.id %}" class="nav__link {% block nav_active_fan %}{% endblock %}" id="nav-fan">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="8" cy="8" r="6.5"/>
                        <path d="M1.5 8h13"/>
                        <path d="M8 1.5c-2 2-2.5 4-2.5 6.5s.5 4.5 2.5 6.5"/>
                        <path d="M8 1.5c2 2 2.5 4 2.5 6.5s-.5 4.5-2.5 6.5"/>
                    </svg>
                    <span>Fan View</span>
                </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'matches/js/studiolens.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
