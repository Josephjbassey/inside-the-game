<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-md);border-bottom:1px solid var(--border-subtle);padding-bottom:var(--space-xs);">
    <span style="font-size:1.125rem;font-weight:700;color:var(--text-primary);">{{ match.home_team }}</span>
    <span style="font-size:1.75rem;font-family:var(--font-mono);font-weight:800;color:var(--text-primary);">{{ match.home_score }} – {{ match.away_score }}</span>
    <span style="font-size:1.125rem;font-weight:700;color:var(--text-primary);">{{ match.away_team }}</span>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-xs);">
    <span style="color:var(--text-secondary);font-size:0.75rem;">Clock</span>
    <span style="color:var(--accent);font-family:var(--font-mono);font-weight:600;" data-clock="{{ match.match_clock }}">{{ match.match_clock }}s</span>
</div>
<div style="color:var(--text-muted);font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.08em;margin-top:var(--space-xs);">{{ match.get_status_display }}</div>
