<div class="grid grid-cols-2 gap-4 text-center">
    <div class="bg-gray-700/50 p-3 rounded border border-gray-600">
        <div class="text-xs text-gray-400 uppercase">{{ match.home_team }}</div>
        <div class="text-lg font-mono text-green-400" id="xg-home">{{ match.xg_home }}</div>
    </div>
    <div class="bg-gray-700/50 p-3 rounded border border-gray-600">
        <div class="text-xs text-gray-400 uppercase">{{ match.away_team }}</div>
        <div class="text-lg font-mono text-green-400" id="xg-away">{{ match.xg_away }}</div>
    </div>
</div>
