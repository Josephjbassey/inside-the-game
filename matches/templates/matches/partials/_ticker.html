{% if events %}
    <div class="space-y-2">
        {% for event in events %}
        <div class="flex items-start gap-3 py-2 border-b border-gray-700/50 last:border-0">
            <span class="text-gray-500 text-xs font-mono">{{ event.minute }}'</span>
            <span class="text-xs font-bold {% if event.event_type == 'goal' %}text-red-400{% elif event.event_type == 'shot' %}text-yellow-400{% else %}text-gray-300{% endif %}">
                {{ event.get_event_type_display }}
            </span>
            <span class="text-xs text-gray-300">{{ event.player }} — {{ event.team }}</span>
            {% if event.xg_value %}<span class="text-xs text-green-400 ml-1">xG {{ event.xg_value }}</span>{% endif %}
        </div>
        {% endfor %}
    </div>
{% else %}
    <p class="text-gray-500 text-sm">No events yet.</p>
{% endif %}
